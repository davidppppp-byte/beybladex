<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEY-COMMANDER X - 多人管理系統</title>
    <!-- 導入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 導入 React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 導入 Lucide 圖示 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; overflow-x: hidden; }
        .bey-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .bey-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px -5px rgba(220, 38, 38, 0.3); }
        .login-btn { transition: all 0.3s ease; }
        .login-btn:hover { transform: scale(1.05); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- 排行榜資料 ---
        const RANKING_DATA = {
            bits: [
                { tier: "T0", items: "H FB LR R", color: "bg-red-600" },
                { tier: "T1", items: "J LO K L UN B W E", color: "bg-orange-600" },
                { tier: "T2", items: "P D FF I UF U T TK TP O OP Y HN", color: "bg-yellow-600 text-black" },
                { tier: "T3", items: "F GR HT GN A RA LF Q n G V GU Z WW", color: "bg-green-600" },
                { tier: "T4", items: "P WB BS S C GF MN TR", color: "bg-blue-600" },
                { tier: "T5", items: "M DB GB", color: "bg-slate-600" },
            ],
            ratchets: [
                { tier: "T0", items: "1-60 1-50 9-60 7-60", color: "bg-red-600" },
                { tier: "T1", items: "1-70 9-70 7-70 3-60 6-60", color: "bg-orange-600" },
                { tier: "T2", items: "4-50 8-70 5-60 0-70 6-70 7-55 4-55 5-70 4-60 1-80 3-70", color: "bg-yellow-600 text-black" },
                { tier: "T3", items: "0-60 9-80 7-80 M-85 4-70", color: "bg-green-600" },
                { tier: "T4", items: "0-80 3-80 2-60 3-85 9-65", color: "bg-blue-600" },
                { tier: "T5", items: "5-80 4-80 6-80 2-70 2-80", color: "bg-slate-600" },
            ]
        };

        const USERS = ["巧巧酥", "黃美", "小剛", "小駿"];

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const App = () => {
            const [currentUser, setCurrentUser] = useState(localStorage.getItem('bey_current_user') || null);
            const [ownedDb, setOwnedDb] = useState([]); // 改名為 ownedDb，使用者自己買的
            const [combos, setCombos] = useState([]);   // 搭配區資料
            const [activeTab, setActiveTab] = useState('catalog');
            const [searchTerm, setSearchTerm] = useState('');
            const [partsFilter, setPartsFilter] = useState('blade');
            
            // Modal 狀態
            const [isOwnedModalOpen, setIsOwnedModalOpen] = useState(false);
            const [isComboModalOpen, setIsComboModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            
            // 表單狀態
            const [ownedForm, setOwnedForm] = useState({ id: '', name: '', ratchet: '', bit: '', type: 'Attack' });
            const [comboForm, setComboForm] = useState({ id: Date.now(), title: '', blade: '', ratchet: '', bit: '', note: '' });

            // 登入後讀取資料
            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('bey_current_user', currentUser);
                    const savedOwned = localStorage.getItem(`bey_owned_list_${currentUser}`);
                    setOwnedDb(savedOwned ? JSON.parse(savedOwned) : []);
                    const savedCombos = localStorage.getItem(`bey_combos_${currentUser}`);
                    setCombos(savedCombos ? JSON.parse(savedCombos) : []);
                }
            }, [currentUser]);

            // 自動儲存
            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem(`bey_owned_list_${currentUser}`, JSON.stringify(ownedDb));
                    localStorage.setItem(`bey_combos_${currentUser}`, JSON.stringify(combos));
                }
            }, [ownedDb, combos, currentUser]);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem('bey_current_user');
            };

            // --- 已購入區功能 ---
            const openOwnedModal = (item = null) => {
                if (item) {
                    setEditingItem(item.id);
                    setOwnedForm(item);
                } else {
                    setEditingItem(null);
                    setOwnedForm({ id: `OWN-${Date.now()}`, name: '', ratchet: '', bit: '', type: 'Attack' });
                }
                setIsOwnedModalOpen(true);
            };

            const saveOwned = () => {
                if (!ownedForm.name) return;
                if (editingItem) {
                    setOwnedDb(ownedDb.map(b => b.id === editingItem ? ownedForm : b));
                } else {
                    setOwnedDb([...ownedDb, ownedForm]);
                }
                setIsOwnedModalOpen(false);
            };

            const deleteOwned = (id) => {
                if (confirm('確定要移除這款陀螺紀錄嗎？')) {
                    setOwnedDb(ownedDb.filter(b => b.id !== id));
                    setIsOwnedModalOpen(false);
                }
            };

            // --- 搭配區功能 ---
            const openComboModal = (item = null) => {
                if (item) {
                    setEditingItem(item.id);
                    setComboForm(item);
                } else {
                    setEditingItem(null);
                    setComboForm({ id: Date.now(), title: '', blade: '', ratchet: '', bit: '', note: '' });
                }
                setIsComboModalOpen(true);
            };

            const saveCombo = () => {
                if (!comboForm.title) return;
                if (editingItem) {
                    setCombos(combos.map(c => c.id === editingItem ? comboForm : c));
                } else {
                    setCombos([...combos, comboForm]);
                }
                setIsComboModalOpen(false);
            };

            const deleteCombo = (id) => {
                if (confirm('確定要刪除這組搭配嗎？')) {
                    setCombos(combos.filter(c => c.id !== id));
                    setIsComboModalOpen(false);
                }
            };

            // --- 計算零件庫 ---
            const ownedParts = useMemo(() => {
                const parts = { blades: new Set(), ratchets: new Set(), bits: new Set() };
                ownedDb.forEach(bey => {
                    parts.blades.add(bey.name);
                    parts.ratchets.add(bey.ratchet);
                    parts.bits.add(bey.bit);
                });
                return {
                    blades: Array.from(parts.blades).sort(),
                    ratchets: Array.from(parts.ratchets).sort(),
                    bits: Array.from(parts.bits).sort()
                };
            }, [ownedDb]);

            const getPartTierInfo = (partName, category) => {
                if (category === 'blade') return null;
                const rankings = RANKING_DATA[category === 'ratchet' ? 'ratchets' : 'bits'];
                for (const rank of rankings) {
                    if (rank.items.split(' ').includes(partName)) return { tier: rank.tier, color: rank.color };
                }
                return null;
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-950 p-6">
                        <div className="mb-12 text-center">
                            <h1 className="text-6xl font-black italic text-transparent bg-clip-text bg-gradient-to-br from-red-600 via-white to-blue-600 uppercase mb-4 tracking-tighter">
                                BEY-COMMANDER X
                            </h1>
                            <p className="text-slate-500 font-bold tracking-[0.3em] uppercase">請選擇使用者登入</p>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl">
                            {USERS.map(user => (
                                <button key={user} onClick={() => setCurrentUser(user)} className="login-btn p-8 bg-slate-900 border-2 border-slate-800 rounded-lg text-3xl font-black hover:border-red-600 hover:bg-slate-800 group relative">
                                    <span className="group-hover:text-red-500 transition-colors">{user}</span>
                                    <div className="mt-2 text-xs text-slate-600 uppercase tracking-widest font-bold">Commander Entry</div>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24">
                    {/* Header */}
                    <header className="p-6 md:p-10 max-w-7xl mx-auto">
                        <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 border-b-4 border-red-600 pb-8">
                            <div>
                                <h1 className="text-5xl md:text-7xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-red-500 via-white to-blue-600 uppercase leading-none">
                                    BEY-COMMANDER X
                                </h1>
                                <p className="text-slate-400 mt-4 font-bold tracking-[0.3em] uppercase text-sm flex items-center gap-2">
                                    <Icon name="user" className="text-red-500" size={16} /> {currentUser} 的戰鬥陀螺
                                </p>
                            </div>
                            <div className="flex gap-4 items-center">
                                <button onClick={handleLogout} className="bg-slate-900 border border-slate-700 px-4 py-2 text-xs font-bold text-slate-400 hover:text-white transition-all flex items-center gap-2">
                                    <Icon name="log-out" size={14} /> 切換帳號
                                </button>
                                <div className="bg-slate-900 border-2 border-slate-700 px-6 py-3 rounded-sm shadow-[5px_5px_0px_#dc2626]">
                                    <div className="flex items-center gap-3 font-black">
                                        <Icon name="package" className="text-blue-500" />
                                        <span className="text-2xl">{ownedDb.length}</span>
                                        <span className="text-[10px] text-slate-500 uppercase">Owned</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Nav */}
                    <nav className="max-w-7xl mx-auto px-6 mb-10 flex flex-wrap gap-3 sticky top-4 z-40">
                        {[
                            { id: 'catalog', label: '已購入區', icon: 'shopping-cart' },
                            { id: 'combos', label: '搭配區', icon: 'layout' },
                            { id: 'parts', label: '零件庫', icon: 'zap' },
                            { id: 'ranking', label: '排行', icon: 'trophy' }
                        ].map(tab => (
                            <button 
                                key={tab.id} 
                                onClick={() => setActiveTab(tab.id)} 
                                className={`px-8 py-4 font-black transition-all flex items-center gap-2 ${activeTab === tab.id ? 'bg-red-600 text-white shadow-[6px_6px_0px_white] -translate-y-1' : 'bg-slate-900 text-slate-500 border border-slate-800'}`}
                            >
                                <Icon name={tab.icon} size={18} />
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="max-w-7xl mx-auto px-6">
                        {/* 已購入區 */}
                        {activeTab === 'catalog' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-4xl font-black italic uppercase text-red-600">Purchased</h2>
                                    <button onClick={() => openOwnedModal()} className="bg-blue-600 px-6 py-3 font-black text-sm flex items-center gap-2 hover:bg-blue-500 transition-colors">
                                        <Icon name="plus" size={18} /> 新增購入
                                    </button>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                    {ownedDb.length === 0 ? (
                                        <div className="col-span-full py-20 text-center border-4 border-dashed border-slate-800 rounded-lg">
                                            <Icon name="shopping-bag" size={48} className="mx-auto text-slate-800 mb-4" />
                                            <p className="text-slate-600 font-black text-xl uppercase italic">目前沒有購入紀錄</p>
                                        </div>
                                    ) : (
                                        ownedDb.map(bey => (
                                            <div key={bey.id} className="bey-card p-5 rounded-lg border-2 border-red-600 bg-slate-900 group">
                                                <div className="flex justify-between items-start mb-4">
                                                    <span className="bg-blue-600 px-2 py-0.5 text-[10px] font-black rounded uppercase">P-LOG</span>
                                                    <button onClick={() => openOwnedModal(bey)} className="p-1 text-slate-500 hover:text-white transition-colors">
                                                        <Icon name="edit-3" size={16} />
                                                    </button>
                                                </div>
                                                <h3 className="text-2xl font-black mb-4 truncate text-white">{bey.name}</h3>
                                                <div className="bg-black/40 p-3 space-y-2 text-xs font-bold text-slate-400 rounded">
                                                    <div className="flex justify-between"><span>RATCHET</span><span className="text-white font-mono">{bey.ratchet}</span></div>
                                                    <div className="flex justify-between"><span>BIT</span><span className="text-white font-mono">{bey.bit}</span></div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 搭配區 */}
                        {activeTab === 'combos' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-4xl font-black italic uppercase text-red-600">Custom Combo</h2>
                                    <button onClick={() => openComboModal()} className="bg-red-600 px-6 py-3 font-black text-sm flex items-center gap-2 hover:bg-red-500 transition-colors">
                                        <Icon name="plus" size={18} /> 新增配置
                                    </button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {combos.length === 0 ? (
                                        <div className="col-span-full py-20 text-center border-4 border-dashed border-slate-800 rounded-lg">
                                            <Icon name="swords" size={48} className="mx-auto text-slate-800 mb-4" />
                                            <p className="text-slate-600 font-black text-xl uppercase italic">尚未新增戰鬥配置</p>
                                        </div>
                                    ) : (
                                        combos.map(combo => (
                                            <div key={combo.id} className="p-6 bg-slate-900 border-2 border-slate-800 rounded-lg flex flex-col hover:border-red-600 transition-colors group">
                                                <div className="flex justify-between items-start mb-4">
                                                    <h3 className="text-3xl font-black text-red-600 italic uppercase truncate mr-4">{combo.title}</h3>
                                                    <button onClick={() => openComboModal(combo)} className="p-1 text-slate-500 hover:text-white"><Icon name="settings" size={20} /></button>
                                                </div>
                                                <div className="grid grid-cols-3 gap-4 mb-6">
                                                    <div className="text-center">
                                                        <div className="text-[10px] font-black text-slate-500 mb-1 uppercase tracking-widest">Blade</div>
                                                        <div className="bg-black p-2 font-bold text-sm h-full flex items-center justify-center border border-slate-800">{combo.blade}</div>
                                                    </div>
                                                    <div className="text-center">
                                                        <div className="text-[10px] font-black text-slate-500 mb-1 uppercase tracking-widest">Ratchet</div>
                                                        <div className="bg-black p-2 font-bold text-sm h-full flex items-center justify-center border border-slate-800">{combo.ratchet}</div>
                                                    </div>
                                                    <div className="text-center">
                                                        <div className="text-[10px] font-black text-slate-500 mb-1 uppercase tracking-widest">Bit</div>
                                                        <div className="bg-black p-2 font-bold text-sm h-full flex items-center justify-center border border-slate-800">{combo.bit}</div>
                                                    </div>
                                                </div>
                                                <div className="bg-slate-800 p-4 rounded text-sm border-l-4 border-red-600">
                                                    <div className="text-[10px] font-black text-red-500 mb-1 uppercase tracking-tighter">Combat Notes</div>
                                                    <p className="text-slate-300 leading-relaxed font-bold">{combo.note || "未填寫備註"}</p>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 零件庫 */}
                        {activeTab === 'parts' && (
                            <div className="bg-slate-900 border-2 border-slate-800 p-8 rounded">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
                                    <h2 className="text-4xl font-black italic uppercase text-red-600">Inventory</h2>
                                    <div className="flex bg-black p-1 border border-slate-800">
                                        {['blade', 'ratchet', 'bit'].map(f => (
                                            <button key={f} onClick={() => setPartsFilter(f)} className={`px-8 py-3 font-black text-sm transition-all ${partsFilter === f ? 'bg-red-600 text-white shadow-lg' : 'text-slate-600 hover:text-slate-300'}`}>
                                                {f === 'blade' ? '戰刃' : f === 'ratchet' ? '固鎖' : '軸心'}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
                                    {(partsFilter === 'blade' ? ownedParts.blades : (partsFilter === 'ratchet' ? ownedParts.ratchets : ownedParts.bits)).map(part => {
                                        const tier = getPartTierInfo(part, partsFilter);
                                        return (
                                            <div key={part} className="bg-slate-950 border-2 border-slate-800 p-6 text-center min-h-[140px] flex flex-col items-center justify-center relative hover:border-white transition-colors">
                                                <div className={`font-black text-white mb-3 ${partsFilter !== 'blade' ? 'font-mono text-xl' : 'text-sm'}`}>{part}</div>
                                                {tier && <div className={`px-4 py-1 text-[10px] font-black rounded-sm ${tier.color}`}>{tier.tier}</div>}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* 排行 */}
                        {activeTab === 'ranking' && (
                            <div className="grid md:grid-cols-2 gap-12">
                                {['bits', 'ratchets'].map(cat => (
                                    <div key={cat} className="space-y-6">
                                        <div className="flex items-center gap-4 mb-8">
                                            <Icon name={cat === 'bits' ? 'zap' : 'shield'} className={cat === 'bits' ? 'text-yellow-500' : 'text-blue-500'} size={40} />
                                            <h2 className="text-5xl font-black italic uppercase tracking-tighter">{cat === 'bits' ? '軸心排行' : '固鎖排行'}</h2>
                                        </div>
                                        {RANKING_DATA[cat].map(r => (
                                            <div key={r.tier} className="flex gap-4 group">
                                                <div className={`w-14 h-14 shrink-0 flex items-center justify-center font-black text-xl italic ${r.color}`}>{r.tier}</div>
                                                <div className="bg-slate-900 border border-slate-800 p-4 flex-grow font-mono font-bold text-slate-200 group-hover:border-slate-500 flex items-center">{r.items}</div>
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Owned Modal */}
                    {isOwnedModalOpen && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm flex items-center justify-center p-4 z-[100]">
                            <div className="bg-slate-900 border-4 border-blue-600 p-8 w-full max-w-md shadow-2xl relative">
                                <button onClick={() => setIsOwnedModalOpen(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white"><Icon name="x" /></button>
                                <h2 className="text-3xl font-black italic mb-8 text-blue-600 uppercase">購入陀螺紀錄</h2>
                                <div className="space-y-5">
                                    <input placeholder="陀螺名稱 (中文)" className="w-full bg-black border border-slate-700 p-3 text-white font-bold outline-none" value={ownedForm.name} onChange={e => setOwnedForm({...ownedForm, name: e.target.value})} />
                                    <div className="grid grid-cols-2 gap-4">
                                        <input placeholder="固鎖 (如 3-60)" className="w-full bg-black border border-slate-700 p-3 text-white font-bold outline-none font-mono" value={ownedForm.ratchet} onChange={e => setOwnedForm({...ownedForm, ratchet: e.target.value})} />
                                        <input placeholder="軸心 (如 F)" className="w-full bg-black border border-slate-700 p-3 text-white font-bold outline-none font-mono" value={ownedForm.bit} onChange={e => setOwnedForm({...ownedForm, bit: e.target.value})} />
                                    </div>
                                    <div className="flex gap-4 mt-6">
                                        {editingItem && (
                                            <button onClick={() => deleteOwned(editingItem)} className="flex-1 bg-slate-800 py-4 font-black text-red-500">刪除</button>
                                        )}
                                        <button onClick={saveOwned} className="flex-[2] bg-blue-600 py-4 font-black text-white">儲存紀錄</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Combo Modal */}
                    {isComboModalOpen && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-sm flex items-center justify-center p-4 z-[100]">
                            <div className="bg-slate-900 border-4 border-red-600 p-8 w-full max-w-md shadow-2xl relative">
                                <button onClick={() => setIsComboModalOpen(false)} className="absolute top-4 right-4 text-slate-500 hover:text-white"><Icon name="x" /></button>
                                <h2 className="text-3xl font-black italic mb-8 text-red-600 uppercase">戰術配置搭配</h2>
                                <div className="space-y-5">
                                    <input placeholder="搭配名稱 (如 爆裂瞬發裝)" className="w-full bg-black border border-slate-700 p-3 text-white font-bold outline-none" value={comboForm.title} onChange={e => setComboForm({...comboForm, title: e.target.value})} />
                                    <div className="grid grid-cols-3 gap-2">
                                        <input placeholder="戰刃" className="bg-black border border-slate-700 p-2 text-xs text-white" value={comboForm.blade} onChange={e => setComboForm({...comboForm, blade: e.target.value})} />
                                        <input placeholder="固鎖" className="bg-black border border-slate-700 p-2 text-xs text-white" value={comboForm.ratchet} onChange={e => setComboForm({...comboForm, ratchet: e.target.value})} />
                                        <input placeholder="軸心" className="bg-black border border-slate-700 p-2 text-xs text-white" value={comboForm.bit} onChange={e => setComboForm({...comboForm, bit: e.target.value})} />
                                    </div>
                                    <textarea placeholder="戰術備註：例如針對持久型或是路徑選擇..." className="w-full bg-black border border-slate-700 p-3 text-white text-sm h-32 resize-none outline-none" value={comboForm.note} onChange={e => setComboForm({...comboForm, note: e.target.value})}></textarea>
                                    <div className="flex gap-4">
                                        {editingItem && (
                                            <button onClick={() => deleteCombo(editingItem)} className="flex-1 bg-slate-800 py-4 font-black text-red-500">刪除</button>
                                        )}
                                        <button onClick={saveCombo} className="flex-[2] bg-red-600 py-4 font-black text-white">儲存配置</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
